name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a failed deploy can be re-run without an empty commit.
  workflow_dispatch:

# Pages needs to write the deployment; the token is scoped to exactly that.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is not cancelled — cancelling mid-deploy
# is how a half-published site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The site lives at Creaitify.github.io/hELM_DEMO, so only that repository
    # has Pages enabled. The same code is pushed to helm-final, where this job
    # would build fine and then fail at configure-pages for want of a site.
    if: github.repository == 'Creaitify/hELM_DEMO'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build the static export
        # next.config.mjs only exports when this is set; without it the build
        # is the server build, which writes .next and no out/ at all.
        env:
          HELM_STATIC_EXPORT: 'true'
          # The project Pages site lives at /<repo>, so assets need that prefix.
          HELM_BASE_PATH: '/hELM_DEMO'
          # Canonical links, Open Graph tags and the sitemap are absolute and
          # baked in here; without this they ship a placeholder domain.
          HELM_SITE_URL: 'https://${{ github.repository_owner }}.github.io/hELM_DEMO'
        run: npm run build

      - name: Disable Jekyll
        # Without this GitHub Pages strips every path beginning with an
        # underscore — which is all of _next, i.e. the entire application.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
